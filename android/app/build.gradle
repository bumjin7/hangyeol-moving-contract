plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hangyeol.movingcontract'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hangyeol.movingcontract'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
